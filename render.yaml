services:
  - type: web
    name: in-out-vendor-api
    env: docker
    region: singapore   # ganti ke region terdekat kalau perlu
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: InOutVendor
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: in-out-vendor-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: in-out-vendor-db
    plan: free
    ipAllowList: []
    # PostgreSQL gratis 90 hari dari Render
